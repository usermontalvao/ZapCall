<!doctype html>
<meta charset="utf-8">
<title>ZapCall — discador</title>
<!--
  Bancada de teste de voz e video.

  Ela fala a MESMA API que o CRM vai falar (REST + o WebSocket com quadros
  binarios de 4 bytes, PCM 16 kHz em quadros de 960 amostras e H.264 Annex-B;
  o byte 2 do header e a rotacao do video em multiplos de 90 graus).
  Por isso o que funciona aqui funciona no CRM — e o que quebra aqui quebra la.
  Os worklets de audio vem de /static/worklets.js, a MESMA fonte que a pagina do
  WhatsApp usa do outro lado da ponte.
-->
<!-- Os worklets ANTES do modulo: fonte unica, compartilhada com a pagina do WhatsApp. -->
<script src="static/worklets.js"></script>
<script src="static/zc-ui.js"></script>
<style>
  :root { --fundo:var(--bg); --cartao:var(--panel); --texto:var(--ink); --fraco:var(--muted); --borda:var(--line); --acento:var(--brand); --perigo:var(--danger); --sombra:var(--shadow); }
  * { box-sizing: border-box; }
  .topoLocal { display:flex; align-items:center; gap:8px; justify-content:flex-end; padding:10px 20px 0; }
  .pilula { font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--borda); color:var(--fraco); }
  .pilula.ok { color:var(--brand-ink); background:var(--brand-soft); border-color:transparent; }
  .pilula.ruim { color:var(--perigo); background:var(--danger-soft); border-color:transparent; }
  main { max-width:940px; margin:16px auto; padding:0 16px; display:grid; grid-template-columns:320px 1fr; gap:16px; align-items:start; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .cartao { background:var(--cartao); border:1px solid var(--borda); border-radius:16px; padding:18px; box-shadow:var(--sombra); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--fraco); margin:0 0 12px; font-weight:600; }
  input[type=tel] { width:100%; font-size:22px; padding:12px 14px; border-radius:12px; border:1px solid var(--line-2); background:var(--panel-2); color:var(--texto); text-align:center; font-variant-numeric:tabular-nums; outline:0; }
  input[type=tel]:focus { border-color:var(--brand); box-shadow:var(--glow); }
  .teclas { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
  .teclas button { padding:12px 0; font-size:18px; border-radius:12px; border:1px solid var(--borda); background:var(--panel-2); color:var(--texto); cursor:pointer; }
  .teclas button:active { background:var(--borda); }
  .acoes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button.principal { padding:13px; border:0; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; color:#06220f; background:var(--acento); }
  button.perigo { background:var(--perigo); color:#fff; }
  button.neutro { background:transparent; color:var(--texto); border:1px solid var(--line-2); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .video { position:relative; background:#000; border-radius:14px; overflow:hidden; aspect-ratio:4/3; display:none; max-height:70vh; margin-left:auto; margin-right:auto; }
  .video.ligado { display:block; }
  .video canvas { width:100%; height:100%; object-fit:contain; display:block; }
  .video video { position:absolute; right:10px; bottom:10px; width:26%; border-radius:8px; border:2px solid rgba(255,255,255,.5); }
  .linha { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--borda); font-size:13px; }
  .linha:last-child { border:0; }
  .linha span:last-child { font-variant-numeric:tabular-nums; color:var(--fraco); }
  .fase { font-size:26px; font-weight:600; letter-spacing:-.01em; }
  .peer { color:var(--fraco); font-size:14px; margin-top:2px; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:220; padding:20px; }
  #modal.aberto { display:flex; }
  .modalCartao { background:var(--cartao); border:1px solid var(--borda); border-radius:22px; padding:26px; width:min(560px,100%); box-shadow:0 30px 80px rgba(0,0,0,.45); text-align:center; }
  .modalCartao.comVideo { width:min(960px,100%); }
  .modalCartao .fase { font-size:30px; }
  .modalCartao .acoes { margin-top:18px; }
  .tocando { animation:pulso 1.1s ease-in-out infinite; }
  @keyframes pulso { 0%,100% { opacity:1 } 50% { opacity:.45 } }
  #log { font:11px/1.5 ui-monospace,Menlo,monospace; color:var(--fraco); max-height:190px; overflow:auto; white-space:pre-wrap; }
  .vazio { color:var(--fraco); font-size:13px; }
</style>

<div class="topoLocal">

<script type="module">
// ------------------------------------------------------------ idiomas
// Mesma chave `zc.lang` do painel e da documentacao: uma escolha vale para tudo.
const I18N = {
  pt: { titulo: 'ZapCall — discador', discar: 'Discar', ligar: 'Ligar', video: 'Vídeo', dica: 'Número completo, com o código do país (ex.: 55 11 99999-9999).', diag: 'Diagnóstico', audioEnv: 'áudio enviado', audioRec: 'áudio recebido', pico: 'pico do que chega', videoRec: 'vídeo recebido', rot: 'rotação / à espera de keyframe', fila: 'fila de subida', eventos: 'Eventos',
        quadros: 'quadros', vozTag: '(voz)', silencio: '(silêncio)', sessao: 'sessão…', pareado: 'pareado', semSessao: 'sem sessão', socketOk: 'socket ok', socketCaiu: 'socket caiu', semSessaoDica: 'Sessão não pareada — leia o QR em /pair.',
        chamandoVoce: 'Chamando você', chamando: 'Chamando…', conectando: 'Conectando…', emChamada: 'Em chamada', naoIdent: 'número não identificado', lidTag: 'LID', atenderVideo: 'Atender com vídeo', soVoz: 'Só voz', atender: 'Atender', recusar: 'Recusar', reativar: 'Reativar som', mudo: 'Mudo', desligar: 'Desligar',
        numeroCurto: 'número curto demais: ', discando: 'discando ', emVideo: ' em VÍDEO', emVoz: ' em voz', falhou: 'falhou: ', pronto: 'discador pronto · cliente ' },
  en: { titulo: 'ZapCall — dialer', discar: 'Dial', ligar: 'Call', video: 'Video', dica: 'Full number with country code (e.g. 1 415 555 0123).', diag: 'Diagnostics', audioEnv: 'audio sent', audioRec: 'audio received', pico: 'incoming peak', videoRec: 'video received', rot: 'rotation / waiting for keyframe', fila: 'upload queue', eventos: 'Events',
        quadros: 'frames', vozTag: '(voice)', silencio: '(silence)', sessao: 'session…', pareado: 'paired', semSessao: 'no session', socketOk: 'socket ok', socketCaiu: 'socket down', semSessaoDica: 'Session not paired — scan the QR at /pair.',
        chamandoVoce: 'Calling you', chamando: 'Calling…', conectando: 'Connecting…', emChamada: 'On call', naoIdent: 'unknown number', lidTag: 'LID', atenderVideo: 'Answer with video', soVoz: 'Voice only', atender: 'Answer', recusar: 'Decline', reativar: 'Unmute', mudo: 'Mute', desligar: 'Hang up',
        numeroCurto: 'number too short: ', discando: 'dialing ', emVideo: ' with VIDEO', emVoz: ' voice', falhou: 'failed: ', pronto: 'dialer ready · client ' },
};
const t = (k) => ZC.t(I18N, k);
function aplicarIdioma() {
  document.title = t('titulo');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
}
// Prefixo da instancia atras do gerente: a barra aponta para o painel e o manual do gerente.
ZC.nav({ links: [
  { href: '/', rotulo: { pt: 'Painel', en: 'Panel' } },
  { href: '#', rotulo: { pt: 'Discador', en: 'Dialer' }, ativo: true },
  { href: '/docs', rotulo: { pt: 'Documentação', en: 'Documentation' } },
] });
ZC.onChange(() => { aplicarIdioma(); if (typeof chamada !== 'undefined' && chamada) desenhar(); });

const KIND_AUDIO = 1, KIND_VIDEO = 2, HEADER = 4, FLAG_KEY = 1;
const RATE = 16000, FRAME = 960;
// Substituido pelo servidor por um objeto so com numeros e o nome do perfil.
// O padrao `realtime` limita de verdade resolucao, bitrate e filas; `ideal`
// sozinho deixava algumas webcams entregarem mais do que a VPS conseguia.
const MEDIA = __ZC_MEDIA_CONFIG__;

// O token da instancia chega pela URL (o unico jeito de abrir uma pagina
// autenticada num navegador), vai para o sessionStorage desta aba e SAI da
// barra de endereco: nao fica no historico, nem em print, nem em link copiado.
const params = new URLSearchParams(location.search);
const token = (() => {
  const daUrl = params.get('token');
  try {
    if (daUrl) { sessionStorage.setItem('zc.dialer.token', daUrl); params.delete('token'); history.replaceState(null, '', location.pathname + (params.size ? '?' + params : '')); return daUrl; }
    return sessionStorage.getItem('zc.dialer.token') || '';
  } catch { return daUrl || ''; }
})();
// Prefixo da instancia quando servido pelo gerente (/instances/<nome>/dialer);
// sem gerente o prefixo e vazio e tudo fica como era.
const base = location.origin + location.pathname.replace(/\/(dialer|discador)\/?$/, '');
// Um clientId POR ABA (sessionStorage): duas abas com o mesmo id viravam duas
// fontes de midia para a mesma chamada, e o video misturado travava.
const clientId = (() => {
  try {
    const k = 'zc.dialer.clientId';
    let v = sessionStorage.getItem(k);
    if (!v) { v = 'dialer-' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem(k, v); }
    return v;
  } catch { return 'dialer-' + Math.random().toString(36).slice(2, 10); }
})();
const cab = () => ({ 'content-type': 'application/json', 'x-client-id': clientId, ...(token ? { Authorization: 'Bearer ' + token } : {}) });

const $ = (id) => document.getElementById(id);
const linhas = [];
function registrar(txt) {
  linhas.unshift(new Date().toLocaleTimeString('pt-BR') + '  ' + txt);
  $('log').textContent = linhas.slice(0, 60).join('\n');
}

// ---------------------------------------------------------------- media
const estado = { enviados: 0, recebidos: 0, pico: 0, video: 0, semKeyframe: 0 };
let ctxSaida = null, noReproducao = null;
let ctxEntrada = null, noCaptura = null, fluxoMic = null, mudo = false;
let decodificador = null, codificador = null, fluxoCam = null, leitorCam = null;
let iniciandoAudio = null, iniciandoVideo = null, configuracaoVideo = null;
let acaoDeChamadaEmCurso = false;

/**
 * Codec H.264 Baseline com o NIVEL certo para a resolucao. `42E01E` e nivel
 * 3.0 (teto 720x576): pedir 1280x720 com ele faz o `configure` estourar e o
 * codificador morrer calado — foi o "zero quadros de video" de 10/09/2026.
 * 3.1 (`1F`) cobre 720p; 4.0 (`28`) cobre 1080p.
 */
function codecH264(w, h, fps = 30) {
  const mb = Math.ceil(w / 16) * Math.ceil(h / 16);
  const mbps = mb * fps;
  return 'avc1.42E0' + (mb <= 1620 && mbps <= 40500 ? '1E' : mb <= 3600 && mbps <= 108000 ? '1F' : '28');
}

/**
 * Os worklets de audio (fonte unica: src/page/worklets.mjs). Chegam pela
 * tag <script src="static/worklets.js"> la em cima; se ela falhou (instancia
 * reiniciando, 503, proxy que perdeu o caminho), o global nao existe e TODA
 * chamada morria com "Cannot read properties of undefined (reading
 * 'reproducao')". Agora o discador busca de novo antes de desistir — e, se
 * desistir, diz o que faltou.
 */
async function worklets() {
  if (window.__ZC_WORKLETS && window.__ZC_WORKLETS.reproducao && window.__ZC_WORKLETS.captura) return window.__ZC_WORKLETS;
  const r = await fetch(base + '/static/worklets.js', { cache: 'no-store' });
  if (!r.ok) throw new Error('worklets de áudio indisponíveis (HTTP ' + r.status + ' em ' + base + '/static/worklets.js)');
  // O arquivo e `window.__ZC_WORKLETS = {json};` — le-se o JSON, sem eval
  // (a CSP das paginas nao permite avaliar string, e nem deveria).
  const m = /=\s*(\{[\s\S]*\});?\s*$/.exec(await r.text());
  let W = null; try { W = m && JSON.parse(m[1]); } catch {}
  if (!W || typeof W.reproducao !== 'string' || typeof W.captura !== 'string') throw new Error('worklets de áudio inválidos em ' + base + '/static/worklets.js');
  window.__ZC_WORKLETS = W;
  registrar('worklets de áudio recarregados');
  return window.__ZC_WORKLETS;
}

async function moduloWorklet(ctx, codigo) {
  const url = URL.createObjectURL(new Blob([codigo], { type: 'application/javascript' }));
  try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
}

async function ligarAudio() {
  if (ctxSaida) return;
  if (iniciandoAudio) return iniciandoAudio;
  iniciandoAudio = (async () => {
    // Contextos em 16 kHz nos dois sentidos: a conversao fica com o WebAudio,
    // e nao com reamostragem escrita a mao no caminho da voz.
    const W = await worklets();
    ctxSaida = new AudioContext({ sampleRate: RATE, latencyHint: 'interactive' });
    await moduloWorklet(ctxSaida, W.reproducao);
    noReproducao = new AudioWorkletNode(ctxSaida, 'jw-reproducao', { numberOfInputs: 0, outputChannelCount: [1] });
    noReproducao.connect(ctxSaida.destination);
    if (ctxSaida.state === 'suspended') await ctxSaida.resume();

    fluxoMic = await navigator.mediaDevices.getUserMedia({
      // Cancelamento de eco LIGADO: a voz do outro lado sai pelo alto-falante
      // desta mesma maquina e voltaria pelo microfone.
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    ctxEntrada = new AudioContext({ sampleRate: RATE, latencyHint: 'interactive' });
    await moduloWorklet(ctxEntrada, W.captura);
    const origem = ctxEntrada.createMediaStreamSource(fluxoMic);
    noCaptura = new AudioWorkletNode(ctxEntrada, 'jw-captura', { numberOfOutputs: 0 });
    noCaptura.port.onmessage = (e) => {
      if (mudo) return;                    // mudo corta o ENVIO, nao a track
      if (enviarQuadro(KIND_AUDIO, 0, e.data)) estado.enviados += 1;
    };
    origem.connect(noCaptura);
    if (ctxEntrada.state === 'suspended') await ctxEntrada.resume();
    registrar('áudio ligado (mic + alto-falante em 16 kHz)');
  })();
  try { await iniciandoAudio; }
  finally { iniciandoAudio = null; }
}

function desligarAudio() {
  try { fluxoMic && fluxoMic.getTracks().forEach(t => t.stop()); } catch {}
  try { ctxEntrada && ctxEntrada.close(); } catch {}
  try { ctxSaida && ctxSaida.close(); } catch {}
  ctxEntrada = ctxSaida = noCaptura = noReproducao = fluxoMic = null;
}

function receberAudio(buffer) {
  const pcm = new Int16Array(buffer, HEADER);
  if (pcm.length !== FRAME) return;
  estado.recebidos += 1;
  for (let i = 0; i < pcm.length; i += 16) { const a = Math.abs(pcm[i]); if (a > estado.pico) estado.pico = a; }
  if (noReproducao) noReproducao.port.postMessage(pcm);
}

/** Rotacao (0..3 = 0/90/180/270 graus, horario) do ULTIMO quadro recebido. O
 *  header e por pacote, mas o decoder e assincrono: a rotacao que vale e a do
 *  pacote mais recente, e o celular gira sem mudar a dimensao do quadro. */
let rotacaoRemota = 0;
/** Depois de configurar (ou recuperar) o decoder so entra a partir de keyframe. */
let decoderEsperaKeyframe = true;
/** Depois de um descarte na subida, o proximo quadro da camera sai keyframe. */
let forcarKeyframe = true;

function desenharRemoto(q) {
  const tela = $('remoto');
  const ctx2d = tela.getContext('2d', { alpha: false });
  const w = q.displayWidth || q.codedWidth, h = q.displayHeight || q.codedHeight;
  const deitado = rotacaoRemota % 2 === 1;
  const tw = deitado ? h : w, th = deitado ? w : h;
  if (tela.width !== tw || tela.height !== th) {
    tela.width = tw; tela.height = th;
    // A caixa segue a proporcao do que chega: um video em pe (celular na
    // mao) numa caixa 4:3 ficava com um terco da largura, parecendo borrado.
    $('areaVideo').style.aspectRatio = tw + ' / ' + th;
    document.querySelector('.modalCartao').classList.add('comVideo');
  }
  ctx2d.save();
  ctx2d.translate(tw / 2, th / 2);
  ctx2d.rotate(rotacaoRemota * Math.PI / 2);
  ctx2d.drawImage(q, -w / 2, -h / 2, w, h);
  ctx2d.restore();
}

/**
 * Cria (ou recria) o decoder do video do CONTATO. Um erro fatal deixa o
 * VideoDecoder em 'closed' para sempre: recuperar e instanciar outro e
 * esperar o proximo keyframe.
 */
function criarDecodificador() {
  if (!('VideoDecoder' in window)) return;
  try { decodificador && decodificador.state !== 'closed' && decodificador.close(); } catch {}
  decoderEsperaKeyframe = true;
  decodificador = new VideoDecoder({
    output: (q) => {
      try { desenharRemoto(q); estado.video += 1; }
      finally { q.close(); }
    },
    error: (e) => { registrar('decodificador: ' + e.message + ' — recriando'); criarDecodificador(); },
  });
  // Annex-B sem description: o SPS/PPS vem dentro do keyframe.
  decodificador.configure({ codec: 'avc1.42E01E', optimizeForLatency: true });
}

async function ligarVideo() {
  if (fluxoCam) return;
  if (iniciandoVideo) return iniciandoVideo;
  iniciandoVideo = (async () => {
    if (!decodificador) criarDecodificador();
    // `max` e o que impede uma webcam/driver de entregar 1080p apesar do
    // `ideal`. A subida sera recodificada pelo WhatsApp; 360p24 continuo e
    // melhor para chamada do que 720p30 acumulando quadros velhos.
    const capturado = await navigator.mediaDevices.getUserMedia({ video: {
      width: { ideal: MEDIA.width, max: MEDIA.width },
      height: { ideal: MEDIA.height, max: MEDIA.height },
      frameRate: { ideal: MEDIA.frameRate, max: MEDIA.frameRate },
    } });
    fluxoCam = capturado;
    $('local').srcObject = fluxoCam;
    const track = fluxoCam.getVideoTracks()[0];
    if (!track) throw new Error('a camera nao entregou uma track de video');
    try { track.contentHint = 'motion'; } catch {}
    // A camera pode entregar menos do que o pedido: o codificador segue o real.
    const st = track.getSettings();
    const larg = st.width || MEDIA.width, alt = st.height || MEDIA.height;
    const fps = Math.min(MEDIA.frameRate, Math.max(1, Math.round(st.frameRate || MEDIA.frameRate)));
    const cfg = {
      codec: codecH264(larg, alt, fps), width: larg, height: alt,
      bitrate: MEDIA.bitrate, framerate: fps,
      latencyMode: 'realtime', avc: { format: 'annexb' },
    };
    const sup = await VideoEncoder.isConfigSupported(cfg).catch(() => null);
    if (!sup || !sup.supported) throw new Error('codificador H.264 nao suporta ' + larg + 'x' + alt + ' (' + cfg.codec + ')');
    configuracaoVideo = { type: 'media-config', kind: 'video', codec: cfg.codec, width: larg, height: alt, frameRate: fps };
    codificador = new VideoEncoder({
      output: (pedaco, metadata) => {
        const corpo = new Uint8Array(pedaco.byteLength);
        pedaco.copyTo(corpo);
        const ehKey = pedaco.type === 'key';
        const dc = metadata && metadata.decoderConfig;
        if (dc && /^avc1\.[0-9a-f]{6}$/i.test(String(dc.codec || ''))) {
          configuracaoVideo = {
            type: 'media-config', kind: 'video', codec: dc.codec,
            width: dc.codedWidth || larg, height: dc.codedHeight || alt,
            frameRate: fps,
          };
        }
        // A configuracao vai imediatamente antes de cada IDR no MESMO socket.
        // Assim o decoder nunca tenta 720p com o perfil anunciado para 480p.
        if (ehKey) enviarConfigVideo();
        if (enviarQuadro(KIND_VIDEO, ehKey ? FLAG_KEY : 0, corpo)) estado.videoEnviados = (estado.videoEnviados || 0) + 1;
        else {
          // Inclusive quando o descartado era o proprio keyframe: antes esse
          // caso ficava congelado ate o GOP de dois segundos seguinte.
          estado.videoDescartados = (estado.videoDescartados || 0) + 1;
          forcarKeyframe = true;
        }
      },
      error: (e) => { registrar('codificador: ' + e.message); forcarKeyframe = true; },
    });
    codificador.configure(sup.config);
    leitorCam = new MediaStreamTrackProcessor({ track }).readable.getReader();
    let n = 0;
    const gop = Math.max(1, Math.round(fps * MEDIA.keyframeIntervalMs / 1000));
    forcarKeyframe = true;
    (async () => {
      for (;;) {
        const { done, value } = await leitorCam.read();
        if (done) break;
        try {
          if (!codificador || codificador.state !== 'configured') continue;
          // Nao codifica um quadro que ja sabemos que ficaria esperando no
          // TCP. Tambem nao deixa o WebCodecs esconder uma segunda fila.
          if (!filaVideoLivre() || codificador.encodeQueueSize >= 2) {
            estado.videoDescartados = (estado.videoDescartados || 0) + 1;
            forcarKeyframe = true;
            continue;
          }
          const chave = forcarKeyframe || n % gop === 0;
          codificador.encode(value, { keyFrame: chave });
          n += 1; forcarKeyframe = false;
        } finally { value.close(); }
      }
    })().catch(e => registrar('captura de vídeo: ' + e.message));
    enviarConfigVideo();
    registrar('câmera realtime: ' + larg + '×' + alt + ' @ ' + fps + ' fps, ' + Math.round(MEDIA.bitrate / 1000) + ' kbps, perfil ' + MEDIA.profile);
    $('areaVideo').classList.add('ligado');
  })();
  try { await iniciandoVideo; }
  catch (e) {
    registrar('câmera indisponível: ' + e.message);
    desligarVideo();
    throw e;
  } finally { iniciandoVideo = null; }
}

async function atender(video) {
  const id = chamada?.callId;
  if (!id || acaoDeChamadaEmCurso) return;
  acaoDeChamadaEmCurso = true;
  try {
    tocar(false);
    await ligarAudio();
    if (video) await ligarVideo();
    await api('/api/calls/' + id + '/accept', { video });
  } catch (e) {
    registrar('falhou ao atender: ' + e.message);
    desligarAudio(); desligarVideo();
  } finally { acaoDeChamadaEmCurso = false; }
}

function desligarVideo() {
  try { leitorCam && leitorCam.cancel(); } catch {}
  try { fluxoCam && fluxoCam.getTracks().forEach(t => t.stop()); } catch {}
  try { codificador && codificador.state !== 'closed' && codificador.close(); } catch {}
  try { decodificador && decodificador.state !== 'closed' && decodificador.close(); } catch {}
  leitorCam = fluxoCam = codificador = decodificador = configuracaoVideo = null;
  rotacaoRemota = 0; decoderEsperaKeyframe = true;
  $('areaVideo').classList.remove('ligado');
  $('areaVideo').style.aspectRatio = '';
  document.querySelector('.modalCartao').classList.remove('comVideo');
  $('local').srcObject = null;
}

function receberVideo(buffer, chave, rotacao) {
  if (!chamada) return;                // pacote atrasado de chamada ja encerrada
  // Numa chamada de VOZ que o contato transforma em video, o decoder ainda
  // nao existe: nasce no primeiro pacote, e a area de video aparece.
  if (!decodificador) { criarDecodificador(); $('areaVideo').classList.add('ligado'); }
  if (!decodificador || decodificador.state !== 'configured') return;
  if (decoderEsperaKeyframe) {
    if (!chave) { estado.semKeyframe += 1; return; }
    decoderEsperaKeyframe = false;
  }
  rotacaoRemota = rotacao & 3;
  try {
    decodificador.decode(new EncodedVideoChunk({
      type: chave ? 'key' : 'delta', timestamp: performance.now() * 1000, data: new Uint8Array(buffer, HEADER),
    }));
  } catch (e) { registrar('decode: ' + e.message + ' — recriando'); criarDecodificador(); }
}

// ------------------------------------------------------------- socket
let ws = null, chamada = null, inicioAtiva = null;
let videoCongestionado = false, reconexao = null;

function enviarConfigVideo() {
  if (!configuracaoVideo || !ws || ws.readyState !== 1) return false;
  try { ws.send(JSON.stringify(configuracaoVideo)); return true; }
  catch { return false; }
}

/** Histerese: ao atingir o teto, so volta quando a fila drenou ate 25%.
 * Isso impede alternar envia/descarta em todo quadro e garante que o primeiro
 * quadro da retomada seja um IDR recente. */
function filaVideoLivre() {
  if (!ws || ws.readyState !== 1) return false;
  const fila = ws.bufferedAmount;
  const limite = MEDIA.browserQueueBytes;
  if (videoCongestionado) {
    if (fila > Math.floor(limite / 4)) return false;
    videoCongestionado = false;
    forcarKeyframe = true;
    return true;
  }
  if (fila > limite) {
    videoCongestionado = true;
    estado.congestionamentos = (estado.congestionamentos || 0) + 1;
    forcarKeyframe = true;
    return false;
  }
  return true;
}

function enviarQuadro(kind, flags, corpo) {
  if (!ws || ws.readyState !== 1) return false;
  // Video para antes de formar segundos de fila. Um keyframe grande pode
  // ultrapassar o teto DEPOIS do send; a histerese segura os deltas seguintes
  // enquanto ele drena. Audio tolera no maximo quatro quadros (240 ms).
  if (kind === KIND_VIDEO) {
    if (!filaVideoLivre()) return false;
  } else if (ws.bufferedAmount > 4 * (HEADER + FRAME * 2)) return false;
  const buf = new Uint8Array(HEADER + corpo.byteLength);
  buf[0] = kind; buf[1] = flags;
  buf.set(new Uint8Array(corpo.buffer || corpo, corpo.byteOffset || 0, corpo.byteLength), HEADER);
  ws.send(buf);
  return true;
}

function conectar() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  const url = base.replace(/^http/, 'ws') + '/ws?clientId=' + encodeURIComponent(clientId) + (token ? '&token=' + encodeURIComponent(token) : '');
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    $('pSocket').textContent = t('socketOk'); $('pSocket').className = 'pilula ok';
    // Tudo que estava no socket anterior se perdeu; nunca retomar por delta.
    videoCongestionado = false; forcarKeyframe = true; enviarConfigVideo();
  };
  ws.onclose = () => {
    $('pSocket').textContent = t('socketCaiu'); $('pSocket').className = 'pilula ruim';
    if (!reconexao) reconexao = setTimeout(() => { reconexao = null; conectar(); }, 1000);
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') {
      const v = new Uint8Array(ev.data);
      if (v[0] === KIND_AUDIO) receberAudio(ev.data);
      else if (v[0] === KIND_VIDEO) receberVideo(ev.data, (v[1] & FLAG_KEY) !== 0, v[2]);
      return;
    }
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'media-control' && msg.action === 'request-keyframe') {
      forcarKeyframe = true;
      estado.keyframesPedidos = (estado.keyframesPedidos || 0) + 1;
      return;
    }
    if (msg.status) mostrarSessao(msg.status);
    if (msg.type === 'hello') { (msg.calls || []).filter(c => c.status !== 'ended').forEach(aplicar); return; }
    if (msg.call) {
      registrar(msg.type + ' · ' + msg.call.status + (msg.call.raw ? ' (' + msg.call.raw + ')' : ''));
      // Erro ao desenhar nao pode sumir no console: foi assim que um convite
      // que CHEGOU nao abriu modal nenhum e pareceu que nada tinha acontecido.
      try { aplicar(msg.call); }
      catch (e) { registrar('ERRO ao desenhar a chamada: ' + (e && e.message)); }
    }
    else if (msg.type === 'error') registrar('erro: ' + JSON.stringify(msg));
  };
}

function mostrarSessao(s) {
  const p = $('pSessao');
  p.textContent = s.connected ? (s.phone ? '+' + s.phone : t('pareado')) : t('semSessao');
  p.className = 'pilula ' + (s.connected ? 'ok' : 'ruim');
  $('bVoz').disabled = $('bVideo').disabled = !s.connected;
  if (!s.connected) $('dica').textContent = t('semSessaoDica');
}

// ------------------------------------------------------------- chamada
async function api(rota, corpo) {
  const r = await fetch(base + rota, { method: corpo === undefined ? 'GET' : 'POST', headers: cab(), body: corpo === undefined ? undefined : JSON.stringify(corpo || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { registrar('HTTP ' + r.status + ' ' + rota + ' → ' + JSON.stringify(j)); throw new Error(j.error || r.status); }
  return j;
}

function aplicar(c) {
  if (c.status === 'ended') {
    if (chamada && c.callId === chamada.callId) {
      registrar('fim: ' + (c.endReason || '?') + (inicioAtiva ? ' após ' + Math.round((Date.now() - inicioAtiva) / 1000) + 's de conversa' : ' sem atendimento'));
      encerrarLocal();
    }
    return;
  }
  chamada = c;
  if (c.status === 'active') {
    if (!inicioAtiva) inicioAtiva = Date.now();
    // Uma aba observadora desenha o estado, mas nao abre outro mic/encoder.
    // `owner` e definido pelo POST de discar/atender; sem owner, a chamada foi
    // atendida fora deste discador e nenhuma aba deve sequestrar a webcam.
    if (c.owner === clientId) {
      ligarAudio().catch(e => { registrar('áudio falhou: ' + e.message); desligarAudio(); });
      if (c.isVideo) ligarVideo().catch(() => {});
    }
  }
  desenhar();
}

// ------------------------------------------------------------- toque
// Chamada recebida TEM de fazer barulho: quem esta trabalhando nao fica
// olhando para a aba. Rajada ascendente, no mesmo AudioContext o tempo todo
// (dois contextos = dois destravamentos de autoplay).
let ctxToque = null, toqueTimer = null;
function tocar(ligar) {
  if (!ligar) {
    if (toqueTimer) { clearInterval(toqueTimer); toqueTimer = null; }
    return;
  }
  if (toqueTimer) return;
  try {
    ctxToque = ctxToque || new AudioContext();
    if (ctxToque.state === 'suspended') ctxToque.resume();
    const rajada = () => {
      const agora = ctxToque.currentTime;
      [0, 0.18, 0.36].forEach((atraso, i) => {
        const osc = ctxToque.createOscillator();
        const g = ctxToque.createGain();
        osc.frequency.value = 520 + i * 130;
        g.gain.setValueAtTime(0.0001, agora + atraso);
        g.gain.exponentialRampToValueAtTime(0.22, agora + atraso + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, agora + atraso + 0.16);
        osc.connect(g); g.connect(ctxToque.destination);
        osc.start(agora + atraso); osc.stop(agora + atraso + 0.18);
      });
    };
    rajada();
    toqueTimer = setInterval(rajada, 2200);
  } catch (e) { registrar('toque indisponível: ' + e.message); }
}

function encerrarLocal() {
  chamada = null; inicioAtiva = null; mudo = false;
  tocar(false);
  desligarAudio(); desligarVideo();
  $('modal').classList.remove('aberto');
}

function desenhar() {
  if (!chamada) { $('modal').classList.remove('aberto'); tocar(false); return; }
  $('modal').classList.add('aberto');
  const chamandoVoce = chamada.direction === 'inbound' && chamada.status === 'ringing';
  tocar(chamandoVoce);
  const rotulos = { ringing: chamada.direction === 'inbound' ? t('chamandoVoce') : t('chamando'), connecting: t('conectando'), active: t('emChamada') };
  $('fase').textContent = rotulos[chamada.status] || chamada.status;
  $('fase').className = 'fase' + (chamandoVoce ? ' tocando' : '');
  // Numa chamada de video a area aparece desde o convite: assim da para ver
  // que NAO esta chegando quadro, em vez de olhar para um cartao sem nada.
  if (chamada.isVideo) $('areaVideo').classList.add('ligado');
  $('peer').textContent = (chamada.phone ? '+' + chamada.phone : (chamada.lid ? t('lidTag') + ' ' + chamada.lid + ' (' + t('naoIdent') + ')' : chamada.peer))
    + (chamada.isVideo ? ' · ' + t('video').toLowerCase() : ' · ' + t('vozTag').replace(/[()]/g, ''));

  const alvo = $('botoesChamada');
  alvo.innerHTML = '';
  const botao = (txt, classe, fn) => { const b = document.createElement('button'); b.textContent = txt; b.className = classe; b.onclick = fn; alvo.appendChild(b); return b; };
  if (chamada.direction === 'inbound' && chamada.status === 'ringing') {
    if (chamada.isVideo) {
      // Convite de video e atendido COM a camera: aceitar como voz joga a
      // camera para um upgrade DEPOIS, e e justamente esse upgrade que o
      // WhatsApp costuma recusar.
      botao(t('atenderVideo'), 'principal', () => atender(true));
      botao(t('soVoz'), 'principal neutro', () => atender(false));
    } else {
      botao(t('atender'), 'principal', () => atender(false));
    }
    botao(t('recusar'), 'principal perigo', () => { tocar(false); api('/api/calls/' + chamada.callId + '/reject', {}); });
  } else {
    const bm = botao(mudo ? t('reativar') : t('mudo'), 'principal neutro', async () => {
      mudo = !mudo;
      await api('/api/calls/' + chamada.callId + '/mute', { muted: mudo }).catch(() => {});
      desenhar();
    });
    bm.disabled = chamada.status !== 'active';
    // `api()` sem corpo manda GET, e a rota de hangup so existe em POST:
    // era por isso que Desligar respondia 404 e a chamada continuava viva.
    botao(t('desligar'), 'principal perigo', () => api('/api/calls/' + chamada.callId + '/hangup', {}).catch(() => {}));
  }
}

async function discar(video) {
  const to = $('numero').value.replace(/\D/g, '');
  if (to.length < 10) { registrar(t('numeroCurto') + to); return; }
  if (acaoDeChamadaEmCurso) return;
  acaoDeChamadaEmCurso = true;
  registrar(t('discando') + to + (video ? t('emVideo') : t('emVoz')));
  try {
    // A camera abre ANTES do POST: permissao negada depois que o telefone
    // do contato ja tocou e pior do que nao ligar.
    await ligarAudio();
    if (video) await ligarVideo();
    const r = await api('/api/calls', { to, video });
    registrar('callId ' + r.callId);
  } catch (e) { registrar(t('falhou') + e.message); desligarAudio(); desligarVideo(); }
  finally { acaoDeChamadaEmCurso = false; }
}

// ------------------------------------------------------------------ UI
$('teclas').innerHTML = ['1','2','3','4','5','6','7','8','9','*','0','#']
  .map(t => '<button data-t="' + t + '">' + t + '</button>').join('');
$('teclas').onclick = (e) => { const t = e.target.dataset.t; if (t) $('numero').value += t; };
$('bVoz').onclick = () => discar(false);
$('bVideo').onclick = () => discar(true);
try { $('numero').value = localStorage.getItem('zc.dialer.ultimo') || ''; } catch {}
$('numero').oninput = () => { try { localStorage.setItem('zc.dialer.ultimo', $('numero').value); } catch {} };

setInterval(() => {
  $('dEnv').textContent = estado.enviados + ' ' + t('quadros');
  $('dRec').textContent = estado.recebidos + ' ' + t('quadros');
  $('dPico').textContent = estado.pico + ' ' + (estado.pico > 300 ? t('vozTag') : t('silencio'));
  $('dVideo').textContent = estado.video + ' ' + t('quadros');
  $('dRot').textContent = (rotacaoRemota * 90) + '° / ' + estado.semKeyframe;
  $('dFila').textContent = (ws && ws.bufferedAmount || 0) + ' B · ' + (estado.videoDescartados || 0) + ' descartados';
  if (chamada && inicioAtiva) $('fase').textContent = t('emChamada') + ' ' + new Date(Date.now() - inicioAtiva).toISOString().slice(14, 19);
}, 500);

fetch(base + '/api/status', { headers: cab() }).then(r => r.json()).then(mostrarSessao).catch(() => {});
conectar();
registrar(t('pronto') + clientId);
</script>
