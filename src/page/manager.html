<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZapCall — painel</title>
<!--
  Painel do gerente. Tres telas sob a mesma barra de todas as paginas
  (zc-ui.js): Instancias (tabela ou cartoes, acoes rapidas, detalhe em
  gaveta com visao geral / webhook / API / logs / zona de perigo),
  Diagnostico (maquina, peso de cada Chrome, autotestes) e Configuracoes.
  Fala so com /manager/*, com a chave global guardada neste navegador e
  enviada SEMPRE em header — nunca em URL.
-->
<script src="/static/zc-ui.js"></script>
<style>
  .pagina { max-width:1280px; margin:0 auto; padding:24px 20px 80px; display:grid; gap:18px; align-content:start; }
  .tela { display:none; } .tela.ativa { display:grid; gap:18px; }
  .cabecalho { display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; }
  .cabecalho h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .cabecalho p { margin:2px 0 0; color:var(--muted); }
  .cabecalho .dir { margin-left:auto; display:flex; gap:8px; align-items:center; }
  #flashes { display:grid; gap:8px; } #flashes:empty { display:none; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; display:grid; gap:2px; }
  .tile > span { color:var(--muted); font-size:12px; font-weight:500; display:flex; align-items:center; gap:6px; }
  .tile > span svg { width:14px; height:14px; }
  .tile > b { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .tile.uso > b { color:var(--live); } .tile.ruim > b { color:var(--danger); }

  .barra { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .busca { flex:1; min-width:220px; position:relative; }
  .busca svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--faint); }
  .busca input { padding-left:32px; }
  .contador { color:var(--muted); font-size:13px; white-space:nowrap; }

  /* tabela */
  .tabela { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  th { color:var(--muted); font-weight:500; font-size:12px; background:var(--panel-2); }
  tbody tr { cursor:pointer; } tbody tr:hover td { background:var(--panel-2); }
  tbody tr.emUso td:first-child { box-shadow:inset 3px 0 0 var(--live); }
  .ident { display:flex; align-items:center; gap:10px; }
  .avatar { width:32px; height:32px; border-radius:6px; display:grid; place-items:center; font-weight:600; color:#fff; font-size:12px; flex:none; }
  .ident .nome { font-weight:600; } .ident .sub { color:var(--muted); font-size:12px; }
  td .acoes { display:flex; gap:4px; justify-content:flex-end; }
  .chamadaMini { display:inline-flex; align-items:center; gap:8px; }
  .eq { display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .eq i { width:3px; background:var(--live); border-radius:2px; animation:eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay:.15s } .eq i:nth-child(3) { animation-delay:.3s } .eq i:nth-child(4) { animation-delay:.45s }
  @keyframes eq { 0%,100% { height:4px } 50% { height:14px } }
  .mono { font-family:var(--mono); font-size:12.5px; }
  .fraco { color:var(--muted); }
  .skelLinha td > span { display:inline-block; height:14px; width:60%; }

  /* cartoes */
  .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; display:grid; gap:12px; cursor:pointer; }
  .card:hover { border-color:var(--line-2); }
  .card.emUso { border-color:var(--live-line); }
  .card .topo { display:flex; align-items:center; gap:10px; } .card .topo .zc-label { margin-left:auto; }
  .card .info { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:12.5px; color:var(--muted); }
  .card .info b { color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; }
  .emUsoBox { display:flex; align-items:center; gap:10px; background:var(--live-soft); border:1px solid var(--live-line); border-radius:6px; padding:8px 10px; font-size:13px; }
  .emUsoBox .tempo { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600; color:var(--live); }
  .card .rodape { display:flex; gap:4px; flex-wrap:wrap; }

  .kv { display:grid; grid-template-columns:180px 1fr; gap:10px 14px; font-size:13.5px; align-items:center; }
  .kv > span { color:var(--muted); }
  .medidor { height:8px; border-radius:999px; background:var(--panel-3); overflow:hidden; margin-top:8px; }
  .medidor i { display:block; height:100%; background:var(--brand); transition:width .4s; }
  .medidor.alerta i { background:var(--warn); } .medidor.critico i { background:var(--danger); }
  .teste { display:grid; gap:4px; }
  .teste div { display:flex; gap:10px; align-items:center; padding:7px 10px; border-radius:6px; background:var(--panel-2); font-size:13px; flex-wrap:wrap; border:1px solid var(--line-soft); }
  .teste .ok { color:var(--brand-ink); font-weight:700; } .teste .falha { color:var(--danger); font-weight:700; }
  .teste small { color:var(--muted); margin-left:auto; text-align:right; }

  /* gaveta */
  .fundo { position:fixed; inset:0; background:rgba(1,4,9,.5); display:none; z-index:190; }
  .fundo.aberto { display:block; }
  .gaveta { position:fixed; top:0; right:0; bottom:0; width:min(640px,100%); background:var(--panel); border-left:1px solid var(--line); z-index:200; transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column; }
  .gaveta.aberta { transform:none; }
  .gaveta header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .gaveta header h2 { margin:0; font-size:16px; font-weight:600; }
  .gaveta header .fechar { margin-left:auto; }
  .abas { display:flex; gap:2px; padding:0 12px; border-bottom:1px solid var(--line); overflow-x:auto; background:var(--panel-2); }
  .abas button { border:0; background:transparent; padding:10px 12px; color:var(--muted); font-weight:500; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; font-size:13.5px; }
  .abas button.ativa { color:var(--ink); border-color:#fd8c73; font-weight:600; }
  .gaveta .corpo { padding:18px; overflow:auto; display:grid; gap:16px; align-content:start; }
  .campo { display:grid; gap:5px; }
  .campo label { font-size:13px; font-weight:600; }
  .campo .ajuda { font-size:12px; color:var(--muted); }
  .campo .erro { font-size:12px; color:var(--danger); min-height:16px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips label { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; padding:3px 9px; border:1px solid var(--line-2); border-radius:999px; cursor:pointer; background:var(--panel-2); }
  .chips input { margin:0; }
  .entregas { display:grid; gap:4px; font-size:12.5px; }
  .entregas div { display:grid; grid-template-columns:70px 1fr auto auto; gap:10px; padding:6px 8px; border-radius:6px; background:var(--panel-2); font-variant-numeric:tabular-nums; }
  .ok { color:var(--brand-ink); } .erro { color:var(--danger); }
  .perigoBox { border:1px solid var(--danger-line); border-radius:var(--radius); }
  .perigoBox > div { display:flex; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .perigoBox > div:last-child { border-bottom:0; }
  .perigoBox b { display:block; } .perigoBox span { color:var(--muted); font-size:12.5px; }
  .perigoBox .zc-btn { margin-left:auto; }
  .logs { background:var(--code-bg); border:1px solid var(--code-line); border-radius:6px; font:12px/1.5 var(--mono); height:min(60vh,520px); overflow:auto; padding:8px 0; }
  .logs div { padding:0 12px; white-space:pre-wrap; word-break:break-all; }
  .logs div:hover { background:var(--panel-3); }
  .logs .n { color:var(--faint); display:inline-block; width:34px; text-align:right; margin-right:12px; user-select:none; }
  .logs .erro { color:var(--danger-ink); } .logs .aviso { color:var(--warn); } .logs .okl { color:var(--brand-ink); }

  /* modal */
  .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:220; padding:20px; background:rgba(1,4,9,.5); }
  .modal.aberto { display:flex; }
  .modalCartao { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); width:min(520px,100%); max-height:92vh; overflow:auto; box-shadow:var(--shadow-lg); display:grid; }
  .modalCartao h3 { margin:0; font-size:15px; font-weight:600; padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .modalCartao h3 .fechar { margin-left:auto; }
  .modalCartao .mc { padding:18px; display:grid; gap:14px; }
  .modalCartao .rodape { display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; border-top:1px solid var(--line); background:var(--panel-2); border-radius:0 0 var(--radius-lg) var(--radius-lg); }
  .qr { display:grid; place-items:center; gap:10px; }
  .qr img { width:min(260px,70vw); height:auto; aspect-ratio:1; image-rendering:pixelated; border-radius:8px; background:#fff; padding:10px; border:1px solid var(--line); }
  .qr .barraTempo { width:min(260px,70vw); height:4px; border-radius:2px; background:var(--panel-3); overflow:hidden; }
  .qr .barraTempo i { display:block; height:100%; background:var(--brand); transition:width 1s linear; }
  .passos { display:grid; gap:6px; font-size:13px; color:var(--muted); }
  .passos div { display:flex; gap:10px; align-items:flex-start; }
  .passos .n { flex:none; width:20px; height:20px; border-radius:50%; background:var(--panel-3); color:var(--ink); display:grid; place-items:center; font-size:11px; font-weight:600; }

  /* login */
  .login { display:grid; place-items:center; min-height:calc(100vh - var(--nav-h)); padding:24px; }
  .loginCartao { width:min(420px,100%); display:grid; gap:14px; }
  .loginCartao .marca { display:flex; align-items:center; gap:10px; font-weight:600; font-size:20px; justify-content:center; }
  .loginCartao .zc-box { padding:22px; display:grid; gap:12px; }
  .loginCartao .rodapeLogin { text-align:center; font-size:13px; color:var(--muted); border:1px solid var(--line); border-radius:var(--radius); padding:12px; }
  .oculto { display:none !important; }
  .girando { animation:gira 1s linear infinite; } @keyframes gira { to { transform:rotate(360deg) } }

  @media (max-width:760px) {
    .pagina { padding:14px 12px 60px; gap:14px; }
    .cabecalho .dir { margin-left:0; width:100%; } .cabecalho .dir .zc-btn { flex:1; }
    .tiles { grid-template-columns:1fr 1fr; }
    .kv { grid-template-columns:1fr; gap:2px 0; } .kv > span { margin-top:10px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .gaveta .corpo { padding:14px; }
    .entregas div { grid-template-columns:1fr 1fr; }
    .vistaSeg { display:none; }
  }
</style>

<div class="login" id="telaLogin">
  <div class="loginCartao">
    <div class="marca" id="loginLogo"></div>
    <div class="zc-box">
      <div><b data-i18n="entrar"></b><div class="fraco" style="font-size:13px" data-i18n="entrarTxt"></div></div>
      <div class="campo"><label data-i18n="chaveGlobal"></label><input class="zc-input" id="chave" type="password" autocomplete="off" placeholder="••••••••••••••••" spellcheck="false"><div class="erro" id="chaveErro"></div></div>
      <button class="zc-btn primario" id="bEntrar" data-i18n="botaoEntrar"></button>
    </div>
    <div class="rodapeLogin" data-i18n="soIntegrar"></div>
  </div>
</div>

<div class="pagina oculto" id="app">
  <div id="flashes"></div>
  <section class="tela ativa" id="telaInstancias">
    <div class="cabecalho">
      <div><h1 data-i18n="h1"></h1><p data-i18n="h1sub"></p></div>
      <div class="dir"><button class="zc-btn" id="bAtualizar" title="R"><span id="icAtualizar"></span><span data-i18n="atualizar"></span></button><button class="zc-btn primario" id="bNova"><span id="icMais"></span><span data-i18n="nova"></span></button></div>
    </div>
    <div class="tiles">
      <div class="tile"><span data-i18n="tTotal"></span><b id="tTotal">–</b></div>
      <div class="tile"><span data-i18n="tPareadas"></span><b id="tPareadas">–</b></div>
      <div class="tile uso"><span data-i18n="tUso"></span><b id="tUso">–</b></div>
      <div class="tile"><span data-i18n="tQr"></span><b id="tQr">–</b></div>
      <div class="tile ruim"><span data-i18n="tParadas"></span><b id="tParadas">–</b></div>
    </div>
    <div class="barra">
      <div class="busca"><span id="icBusca"></span><input class="zc-input" id="busca" data-i18n-ph="buscar" autocomplete="off"></div>
      <select class="zc-select" id="filtro"></select>
      <div class="zc-seg vistaSeg" id="vista"><button data-v="tabela" data-i18n="vTabela"></button><button data-v="cartoes" data-i18n="vCartoes"></button></div>
      <span class="contador" id="contador"></span>
    </div>
    <div class="zc-box tabela" id="caixaTabela"><table><thead id="cabTabela"></thead><tbody id="corpoTabela"></tbody></table></div>
    <div class="grade oculto" id="grade"></div>
  </section>

  <section class="tela" id="telaDiag">
    <div class="cabecalho"><div><h1 data-i18n="diagTit"></h1><p data-i18n="diagSub"></p></div><div class="dir"><button class="zc-btn" id="bDiagAtualizar" data-i18n="atualizar"></button></div></div>
    <div class="tiles" id="diagTiles"></div>
    <div class="zc-box"><header data-i18n="diagMaquina"></header><div class="zc-corpo kv" id="diagMaquina"></div></div>
    <div class="zc-box"><header data-i18n="diagPeso"></header><div class="tabela"><table id="diagTabela"></table></div><div class="zc-corpo fraco" style="font-size:13px;padding-top:10px" data-i18n="diagPesoTxt"></div></div>
    <div class="zc-box"><header data-i18n="diagTestes"></header><div class="zc-corpo" style="display:grid;gap:12px"><p class="fraco" style="margin:0;font-size:13px" data-i18n="diagTestesTxt"></p><div id="diagTestesLista" style="display:grid;gap:10px"></div></div></div>
  </section>

  <section class="tela" id="telaConfig">
    <div class="cabecalho"><div><h1 data-i18n="configTit"></h1><p data-i18n="configSub"></p></div></div>
    <div class="zc-box"><header data-i18n="aparencia"></header><div class="zc-corpo kv">
      <span data-i18n="idioma"></span><div style="display:flex;gap:8px;flex-wrap:wrap" id="cfgIdioma"></div>
      <span data-i18n="tema"></span><div style="display:flex;gap:8px;flex-wrap:wrap" id="cfgTema"></div>
      <span></span><div class="fraco" style="font-size:12.5px" data-i18n="aparenciaTxt"></div>
    </div></div>
    <div class="zc-box"><header data-i18n="acesso"></header><div class="zc-corpo kv" id="cfgAcesso"></div></div>
    <div class="zc-box"><header data-i18n="servico"></header><div class="zc-corpo kv" id="cfgServico"></div></div>
  </section>
</div>

<div class="fundo" id="fundo"></div>
<aside class="gaveta" id="gaveta" aria-hidden="true">
  <header><div class="avatar" id="gAvatar">?</div><div><h2 id="gNome">—</h2><div id="gSub" class="fraco" style="font-size:12.5px"></div></div><button class="zc-btn icone fechar" id="gFechar" aria-label="close"></button></header>
  <div class="abas" id="gAbas"><button class="ativa" data-aba="geral" data-i18n="abaGeral"></button><button data-aba="webhook" data-i18n="abaWebhook"></button><button data-aba="codigo" data-i18n="abaCodigo"></button><button data-aba="logs" data-i18n="abaLogs"></button><button data-aba="perigo" data-i18n="abaPerigo"></button></div>
  <div class="corpo" id="gCorpo"></div>
</aside>
<div class="modal" id="modal"><div class="modalCartao" id="modalConteudo" role="dialog" aria-modal="true"></div></div>

class ErroApi extends Error { constructor(status, corpo) { super(corpo.message || corpo.error || ('HTTP ' + status)); this.status = status; this.corpo = corpo; } }
async function api(rota, metodo = 'GET', corpo) {
  let r;
  try { r = await fetch(rota, { method: metodo, headers: cab(), body: corpo === undefined ? undefined : JSON.stringify(corpo) }); }
  catch (e) { servicoCaiu(); throw new Error(t('semServico')); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { sessaoExpirou(); throw new ErroApi(401, { message: t('chaveInvalida') }); }
  if (r.status === 429) { throw new ErroApi(429, { message: t('bloqueado') }); }
  if (!r.ok) throw new ErroApi(r.status, j);
  servicoVoltou();
  return j;
}

$('bEntrar').onclick = async () => {

async function abrirGaveta(i, aba) {
  gavetaAberta = i; abaAtual = aba || 'geral'; tokenVisivel = false;
  $('gAvatar').textContent = iniciais(i); $('gAvatar').style.background = corDe(i.name);
  $('gNome').textContent = i.name; $('gSub').textContent = (i.channel ? i.channel + ' · ' : '') + (i.connected ? telefone(i.phone) : t('semSessao'));
  [...$('gAbas').children].forEach(b => b.classList.toggle('ativa', b.dataset.aba === abaAtual));
  $('fundo').classList.add('aberto'); $('gaveta').classList.add('aberta'); $('gaveta').setAttribute('aria-hidden', 'false');
  try { detalhe = (await api('/manager/instances/' + i.name)).instance; } catch (e) { toast(e.message, true); detalhe = null; }
  desenharGaveta();
}
function fecharGaveta() { gavetaAberta = null; if (logsTimer) { clearInterval(logsTimer); logsTimer = null; } $('fundo').classList.remove('aberto'); $('gaveta').classList.remove('aberta'); $('gaveta').setAttribute('aria-hidden', 'true'); }
$('gFechar').onclick = fecharGaveta; $('fundo').onclick = fecharGaveta;
$('gAbas').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; abaAtual = b.dataset.aba; [...$('gAbas').children].forEach(x => x.classList.toggle('ativa', x === b)); desenharGaveta(); };
const testeHtml = (r) => `<div class="teste">${r.itens.map(x => `<div><span class="${x.ok ? 'ok' : 'falha'}">${x.ok ? '✓' : '✕'}</span><span>${esc(x.nome)}</span><small>${esc(x.detalhe || '')}</small></div>`).join('')}<div style="background:transparent;border:0;padding:4px 10px"><b class="${r.ok ? 'ok' : 'falha'}">${r.ok ? t('passou') : t('falhou')}</b></div></div>`;
const classeLog = (l) => /\b(erro|error|fatal|exception|falha|failed)\b/i.test(l) ? 'erro' : /\b(warn|aviso|reiniciando|recriando|caiu)\b/i.test(l) ? 'aviso' : /\b(pareado|ouvindo|de pe|ok)\b/i.test(l) ? 'okl' : '';

      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${i.running && i.healthy && !i.connected ? '<button class="zc-btn primario" id="gParear">' + I.qr + '<span>' + t('parear') + '</span></button>' : ''}
        ${i.connected ? '<button class="zc-btn" id="gDiscador">' + I.telefone + '<span>' + t('abrirDiscador') + '</span></button>' : ''}
        <button class="zc-btn" id="gTeste">${I.pulso}<span>${t('rodarTeste')}</span></button>
        <button class="zc-btn" id="gReiniciar">${I.reiniciar}<span>${t('reiniciar')}</span></button>
      </div>
      <div id="gTesteSaida"></div>`;
    $('gSalvar').onclick = async () => { try { await api('/manager/instances/' + i.name, 'PATCH', { channel: $('gCanal').value.trim() || null }); toast(t('rotuloSalvo')); atualizar(); } catch (e) { toast(e.message, true); } };
    if ($('gParear')) $('gParear').onclick = () => parear(i);

    $('gTeste').onclick = async () => { $('gTesteSaida').innerHTML = '<span class="fraco">' + t('testando') + '</span>'; try { $('gTesteSaida').innerHTML = testeHtml(await api('/manager/instances/' + i.name + '/selftest', 'POST', {})); } catch (e) { toast(e.message, true); $('gTesteSaida').innerHTML = ''; } };

  }
  if (abaAtual === 'webhook') {

    c.innerHTML = `
      <div class="zc-flash">${I.info}<div>${t('whTxt')}</div></div>
      <div class="campo"><label>${t('url')}</label><input class="zc-input" id="wUrl" value="${esc(w.url || '')}" placeholder="https://example.com/zapcall" spellcheck="false"></div>
      <div class="campo"><label>${t('eventos')}</label><div class="chips">${eventos.map(ev => `<label><input type="checkbox" value="${ev}" ${(w.events || []).includes(ev) ? 'checked' : ''}>${ev}</label>`).join('')}</div></div>

      <div><button class="zc-btn primario" id="wSalvar">${t('salvarWebhook')}</button></div>
      <div><b style="font-size:13px">${t('ultimasEntregas')}</b><div class="entregas" style="margin-top:6px">${entregas.length ? entregas.slice().reverse().map(d => `<div><span>${ZC.formatarHora(d.at)}</span><span>${esc(d.event)}</span><span class="${d.status && d.status < 300 ? 'ok' : 'erro'}">${d.status ? 'HTTP ' + d.status : esc(d.error || '…')}</span><span class="fraco">${d.tentativas} ${t('tentativa')}</span></div>`).join('') : '<div class="fraco">' + t('nenhumaAinda') + '</div>'}</div></div>
      ${ZC.pre('{ "event": "call_active", "instance": "' + i.name + '", "date_time": "…", "server_url": "…",\n  "data": { "callId": "…", "direction": "outbound", "status": "active", "phone": "15551234567", "isVideo": false } }')}`;
    $('wSalvar').onclick = async () => {
      const events = [...c.querySelectorAll('.chips input:checked')].map(x => x.value);
      try { await api('/manager/instances/' + i.name, 'PATCH', { webhook: { url: $('wUrl').value.trim() || null, enabled: $('wOn').checked, events } }); toast(t('webhookSalvo')); desenharGaveta(); } catch (e) { toast(e.message, true); }
    };
  }
  if (abaAtual === 'codigo') {
    const tk = detalhe ? detalhe.token : t('semAcesso'), o = location.origin, p = '/instances/' + i.name;
    const mostrado = tokenVisivel ? tk : '•'.repeat(24);
    c.innerHTML = `
      <div class="zc-flash aviso">${I.alerta}<div>${t('tokenTxt', { n: esc(i.name) })}</div></div>
      <div class="campo"><label>${t('token')}</label><div style="display:flex;gap:6px;align-items:flex-start"><div style="flex:1">${ZC.pre(mostrado)}</div><button class="zc-btn" id="cVer">${tokenVisivel ? t('ocultar') : t('mostrar')}</button></div></div>
      <div class="campo"><label>${t('exLigar')}</label>${ZC.pre(`curl -X POST ${o}/call/offer/${i.name} \\\n  -H "apikey: ${mostrado}" -H "Content-Type: application/json" \\\n  -d '{"number":"15551234567","isVideo":false}'`)}</div>
      <div class="campo"><label>${t('exEstado')}</label>${ZC.pre(`curl ${o}/instance/connectionState/${i.name} -H "apikey: ${mostrado}"`)}</div>
      <div class="campo"><label>${t('exWs')}</label>${ZC.pre(`${o.replace(/^http/, 'ws')}${p}/ws?clientId=my-backend&token=${mostrado}`)}</div>
      <div class="campo"><label>${t('exDiscador')}</label>${ZC.pre(`${o}${p}/dialer?token=${mostrado}`)}</div>
      <div><a class="zc-btn" href="/docs" target="_blank" rel="noopener">${I.livro}<span>${t('docsLink')}</span>${I.externo}</a></div>`;
    $('cVer').onclick = () => { tokenVisivel = !tokenVisivel; desenharGaveta(); };
  }
  if (abaAtual === 'logs') {
    if (!c.querySelector('#logsCaixa')) {
      c.innerHTML = `
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <div class="busca" style="min-width:160px"><span>${I.busca}</span><input class="zc-input" id="lFiltro" placeholder="${t('filtrarLogs')}" value="${esc(logsFiltro)}"></div>
          <button class="zc-btn pequeno ${logsAoVivo ? 'primario' : ''}" id="lVivo">${logsAoVivo ? I.pausa : I.play}<span>${t('autoAtualizar')}</span></button>
          <button class="zc-btn pequeno" id="lCopiar">${I.copiar}<span>${t('copiarLogs')}</span></button>
          <span class="fraco" style="font-size:12.5px;margin-left:auto" id="lConta"></span>
        </div>
        <div class="logs" id="logsCaixa"></div>`;
      $('lFiltro').oninput = (e) => { logsFiltro = e.target.value; carregarLogs(); };
      $('lVivo').onclick = () => { logsAoVivo = !logsAoVivo; desenharGaveta(); };

    } else { $('lVivo').className = 'zc-btn pequeno ' + (logsAoVivo ? 'primario' : ''); $('lVivo').innerHTML = (logsAoVivo ? I.pausa : I.play) + '<span>' + t('autoAtualizar') + '</span>'; }
    await carregarLogs();
    if (logsTimer) clearInterval(logsTimer);
    if (logsAoVivo) logsTimer = setInterval(carregarLogs, 2000);
  }
  if (abaAtual === 'perigo') {
    c.innerHTML = `<div class="perigoBox">
      <div><div><b>${t('reiniciar')}</b><span>${t('reiniciarDesc')}</span></div><button class="zc-btn" id="pReiniciar">${t('reiniciar')}</button></div>
      <div><div><b>${i.enabled ? t('desligar') : t('ligar')}</b><span>${t('desligarDesc')}</span></div><button class="zc-btn" id="pLigar">${i.enabled ? t('desligar') : t('ligar')}</button></div>

      ${i.connected ? `<div><div><b>${t('desparear')}</b><span>${t('desparearDesc')}</span></div><button class="zc-btn perigo" id="pLogout">${t('desparear')}</button></div>` : ''}
      <div><div><b>${t('excluir')}</b><span>${t('excluirDesc')}</span></div><button class="zc-btn perigo" id="pExcluir">${t('excluir')}</button></div>

    $('pLigar').onclick = () => ligar(i, !i.enabled);
    $('pGirar').onclick = () => confirmar(t('girarTit'), t('girarTxt'), async () => {
      try { await api('/manager/instances/' + i.name + '/token', 'POST', {}); detalhe = (await api('/manager/instances/' + i.name)).instance; toast(t('tokenNovo')); abaAtual = 'codigo'; tokenVisivel = true; [...$('gAbas').children].forEach(x => x.classList.toggle('ativa', x.dataset.aba === 'codigo')); desenharGaveta(); } catch (e) { toast(e.message, true); }

      try { await api('/manager/instances/' + i.name + (purge ? '?purge=1' : ''), 'DELETE'); toast(t('excluida', { n: i.name })); fecharGaveta(); atualizar(); } catch (e) { toast(e.message, true); }
    }, { check: t('excluirCheck'), digitar: i.name });
  }
}
async function carregarLogs() {
  const i = gavetaAberta; if (!i || !$('logsCaixa')) return;
  let logs = [];
  try { logs = (await api('/manager/instances/' + i.name + '/logs')).logs || []; } catch (e) { if (logsTimer) { clearInterval(logsTimer); logsTimer = null; } return; }
  const caixa = $('logsCaixa');
  const noFim = caixa.scrollTop + caixa.clientHeight >= caixa.scrollHeight - 8;
  const q = logsFiltro.toLowerCase();
  const visiveis = logs.map((l, n) => [l, n + 1]).filter(([l]) => !q || l.toLowerCase().includes(q));
  caixa.dataset.bruto = logs.join('\n');
  caixa.innerHTML = visiveis.length ? visiveis.map(([l, n]) => `<div class="${classeLog(l)}"><span class="n">${n}</span>${esc(l)}</div>`).join('') : '<div class="fraco">' + t('vazio') + '</div>';
  $('lConta').textContent = t('ultimasLinhas', { n: visiveis.length });
  if (noFim || !caixa.dataset.rolou) { caixa.scrollTop = caixa.scrollHeight; caixa.dataset.rolou = '1'; }
}
function confirmar(titulo, texto, fn, op = {}) {
  modal(esc(titulo), `<div class="fraco">${esc(texto)}</div>${op.digitar ? `<div class="campo"><input class="zc-input" id="cfNome" placeholder="${esc(t('digiteNome', { n: op.digitar }))}" autocomplete="off" spellcheck="false"></div>` : ''}${op.check ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cfCheck"> ${esc(op.check)}</label>` : ''}`,
    `<button class="zc-btn" onclick="fecharModal()">${t('cancelar')}</button><button class="zc-btn perigo" id="cfOk" ${op.digitar ? 'disabled' : ''}>${t('confirmar')}</button>`);
  if (op.digitar) { $('cfNome').oninput = () => { $('cfOk').disabled = $('cfNome').value.trim() !== op.digitar; }; $('cfNome').onkeydown = (e) => { if (e.key === 'Enter' && !$('cfOk').disabled) $('cfOk').click(); }; }
  $('cfOk').onclick = () => { const v = $('cfCheck') ? $('cfCheck').checked : undefined; fecharModal(); fn(v); };
}

// ---------------------------------------------------------- diagnostico
let sistemaCache = null, testesCache = {};
async function diagnostico() { try { sistemaCache = await api('/manager/system'); } catch (e) { toast(e.message, true); return; } desenharDiag(); }
function desenharDiag() {
  const s = sistemaCache; if (!s || tela !== 'diagnostico') return;
  const memUsoPct = Math.round((1 - s.memLivreMb / s.memTotalMb) * 100);
  const cargaPct = Math.min(100, Math.round((s.load[0] / s.cpus) * 100));
  const discoPct = s.disco ? Math.round((s.disco.usadoGb / s.disco.totalGb) * 100) : 0;
  const nivel = (p) => p > 90 ? 'critico' : p > 75 ? 'alerta' : '';
  $('diagTiles').innerHTML = `
    <div class="tile"><span>${t('tCpu')}</span><b>${s.cpus} · ${s.load[0]}</b><div class="medidor ${nivel(cargaPct)}"><i style="width:${cargaPct}%"></i></div></div>
    <div class="tile"><span>${t('tMem')}</span><b>${(s.memLivreMb / 1024).toFixed(1)} GB</b><div class="medidor ${nivel(memUsoPct)}"><i style="width:${memUsoPct}%"></i></div></div>
    <div class="tile"><span>${t('tDisco')}</span><b>${s.disco ? s.disco.livreGb + ' GB' : '—'}</b><div class="medidor ${nivel(discoPct)}"><i style="width:${discoPct}%"></i></div></div>
    <div class="tile"><span>${t('uptime')}</span><b>${tempoNoAr(s.uptime)}</b></div>`;
  $('diagMaquina').innerHTML = `
    <span>${t('versao')}</span><div>ZapCall ${esc(s.version)} · ${t('node')} ${esc(s.node)} · ${esc(s.platform)}</div>
    <span>${t('gerenteMem')}</span><div>${s.gerente ? s.gerente.rssMb + ' MB · ' + t('cpu') + ' ' + s.gerente.cpu + '%' : '—'}</div>
    <span>${t('cfgDadosK')}</span><div><code>${esc(s.dataDir)}</code></div>`;
  $('diagTabela').innerHTML = `<thead><tr><th>${t('inst')}</th><th>${t('node')}</th><th>${t('chromeProc')}</th><th>${t('ram')}</th><th>${t('cpu')}</th></tr></thead><tbody>` +
    (s.instancias.length ? s.instancias.map(i => `<tr style="cursor:default"><td><b>${esc(i.nome)}</b></td><td>${i.node ? i.node.rssMb + ' MB' : '—'}</td><td>${i.chrome.processos}</td><td>${i.chrome.rssMb} MB</td><td>${i.chrome.cpu.toFixed(0)}%</td></tr>`).join('') : `<tr><td colspan="5" class="fraco">${t('vazioTit')}</td></tr>`) + '</tbody>';
  $('diagTestesLista').innerHTML = instancias.map(i => `<div class="zc-box" style="padding:12px;display:grid;gap:8px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="avatar" style="background:${corDe(i.name)};width:28px;height:28px;font-size:11px">${esc(iniciais(i))}</div><b>${esc(i.name)}</b><span class="fraco" style="font-size:13px">${i.channel ? esc(i.channel) : ''}</span><button class="zc-btn pequeno" data-teste="${i.name}" style="margin-left:auto">${I.pulso}<span>${t('testar')}</span></button></div><div id="teste-${i.name}">${testesCache[i.name] ? testeHtml(testesCache[i.name]) : '<span class="fraco" style="font-size:13px">' + t('semTeste') + '</span>'}</div></div>`).join('');
  $('diagTestesLista').querySelectorAll('[data-teste]').forEach(b => b.onclick = async () => {
    const n = b.dataset.teste; $('teste-' + n).innerHTML = '<span class="fraco">' + t('testando') + '</span>';
    try { testesCache[n] = await api('/manager/instances/' + n + '/selftest', 'POST', {}); $('teste-' + n).innerHTML = testeHtml(testesCache[n]); } catch (e) { toast(e.message, true); }
  });
}
$('bDiagAtualizar').onclick = diagnostico;
setInterval(() => { if (tela === 'diagnostico' && chave) diagnostico(); }, 10000);

    <span>${t('cfgInstK')}</span><div>${c.instancias}</div>
    <span>${t('cfgDocsK')}</span><div><a href="/docs">/docs</a> — ${t('cfgDocsTxt')}</div>`;

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { fecharModal(); fecharGaveta(); } });
aplicarTextos();
entrar(!!chave);
